[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "molgent"
version = "0.1.0"
description = "Agent-orchestrated MD + MM/PBSA workflows for structural-biology paper reproduction"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "MolGent contributors"}]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "biopython>=1.83",
    "rdkit>=2024.3",
    "mdanalysis>=2.7",
    "mdtraj>=1.10",
    "parmed>=4.2",
    "matplotlib>=3.8",
    "openmm>=8.1",
    "pdbfixer>=1.9",
    "anthropic>=0.40",
    "requests>=2.31",
]

[project.optional-dependencies]
# Installable via pip on most systems but heavier; required for ligand FF generation.
gpu = ["openmmforcefields>=0.14"]
dev = ["pytest>=8", "pytest-cov", "ruff"]
# Paper-faithful (GROMACS/CHARMM36m) pipeline — pulls AmberTools-side helpers
# in addition to a system-installed GROMACS (`brew install gromacs`) and a
# conda-installed AmberTools (`mamba install -c conda-forge ambertools`).
gromacs = ["gmx_MMPBSA>=1.6"]

[project.scripts]
molgent = "molgent.agent.cli:main"
molgent-clc2 = "molgent.workflows.clc2_ak42.run:main"
molgent-clc2-gmx = "molgent.workflows.clc2_ak42.run_gromacs:main"

[tool.setuptools.packages.find]
include = ["molgent*"]

[tool.setuptools.package-data]
"molgent.templates.gmx_mdp" = ["*.mdp", "*.in"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
